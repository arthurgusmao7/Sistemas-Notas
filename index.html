<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Sistema de Notas</h1>
        <p>Cadastre o aluno e calcule sua média.</p>

       <p><form id="formulario">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite o nome do aluno"></p>

            <p><label for="idade">Idade:</label>
            <input type="number" id="idade" placeholder="Digite a idade"
             min="1" max="" required></p>

            <p><label for="nota1">Primeira nota:</label>
            <input type="number" id="nota1" placeholder="Nota de 0 a 10" step="any"
            min="1" max="10"></p>

            <p><label for="nota2">Segunda nota:</label>
            <input type="number" id="nota2" placeholder="Nota de 0 a 10" step="any"
             min="1" max="10"></p>

           <p> <label for="nota3">Terceira nota:</label>
            <input type="number" id="nota3" placeholder="Nota de 0 a 10" step="any"
             min="1" max="10"></p>

            <div class="botoes">
                <button type="submit">Calcular média</button>
                <button type="button" id="limpar" class="botao-limpar">
                    Limpar
                </button>
            </div>
        </form>

        <div id="resultado" aria-live="polite"></div>
    </main>

</body>
</html>
